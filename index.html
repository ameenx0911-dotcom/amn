<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET Social Platform — Complete 20-Phase Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" class="flex-1 flex flex-col h-screen overflow-hidden"></div>

    <script>
        const defaultUsers = [
            { username: 'alex_dev', displayName: 'Alex Turner', password: 'password123', bio: 'Full-stack builder & designer.', avatar: 'https://placehold.co/150/6366f1/ffffff?text=AT', followers: ['sarah_c'], following: ['sarah_c'], role: 'admin' },
            { username: 'sarah_c', displayName: 'Sarah Chen', password: 'password123', bio: 'AI researcher and open-source enthusiast.', avatar: 'https://placehold.co/150/ec4899/ffffff?text=SC', followers: ['alex_dev'], following: ['alex_dev'], role: 'user' }
        ];

        let state = {
            currentUser: null,
            activeTab: 'feed',
            allUsers: JSON.parse(localStorage.getItem('get_users')) || defaultUsers,
            posts: JSON.parse(localStorage.getItem('get_posts')) || [
                { id: 'p1', author: 'sarah_c', content: 'Excited to launch our new open source project today! Check out the repo.', image: '', likes: ['alex_dev'], comments: [{ id: 'c1', author: 'alex_dev', text: 'Looks amazing Sarah!', createdAt: Date.now() - 3600000 }], createdAt: Date.now() - 7200000 }
            ],
            stories: JSON.parse(localStorage.getItem('get_stories')) || [
                { id: 's1', author: 'sarah_c', media: 'https://placehold.co/600x900/4f46e5/ffffff?text=Working+Late', type: 'image', audio: null, caption: 'Late night coding session 💻', createdAt: Date.now() - 1000000 }
            ],
            messages: JSON.parse(localStorage.getItem('get_messages')) || [],
            groups: JSON.parse(localStorage.getItem('get_groups')) || [
                { id: 'g1', name: 'Developers Hangout', admin: 'alex_dev', admins: ['alex_dev'], members: ['alex_dev', 'sarah_c'], avatar: 'https://placehold.co/150/0ea5e9/ffffff?text=Dev' }
            ],
            notifications: JSON.parse(localStorage.getItem('get_notifications')) || [],
            blocks: JSON.parse(localStorage.getItem('get_blocks')) || [],
            reports: JSON.parse(localStorage.getItem('get_reports')) || [],
            theme: localStorage.getItem('get_theme') || 'light',
            activeChatUser: null,
            activeGroupChatId: null,
            activeModal: null,
            previewMediaUrl: null,
            previewMediaType: null,
            previewProfileUser: null,
            selectedFile: null,
            newGroupSelectedMembers: [],
            newGroupSelectedAdmins: [],
            newGroupUserSearch: '',
            groupSettingsUserSearch: '',
            searchQuery: '',
            activeStoryIndex: 0
        };

        function persist() {
            try {
                localStorage.setItem('get_users', JSON.stringify(state.allUsers));
                localStorage.setItem('get_posts', JSON.stringify(state.posts));
                localStorage.setItem('get_stories', JSON.stringify(state.stories));
                localStorage.setItem('get_messages', JSON.stringify(state.messages));
                localStorage.setItem('get_groups', JSON.stringify(state.groups));
                localStorage.setItem('get_notifications', JSON.stringify(state.notifications));
                localStorage.setItem('get_blocks', JSON.stringify(state.blocks));
                localStorage.setItem('get_reports', JSON.stringify(state.reports));
                localStorage.setItem('get_theme', state.theme);
            } catch (e) {
                console.error('Storage limit reached:', e);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
                return;
            }

            app.innerHTML = `
                <div class="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-950 w-full">
                    <aside class="w-20 lg:w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col justify-between p-4 z-20 shrink-0">
                        <div class="space-y-6">
                            <div class="flex items-center gap-3 px-2 cursor-pointer" onclick="window.switchTab('feed')">
                                <div class="w-10 h-10 rounded-2xl bg-brand-600 text-white font-extrabold flex items-center justify-center text-xl shadow-lg shadow-brand-500/30">G</div>
                                <span class="hidden lg:block font-black text-xl tracking-tight bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">GET</span>
                            </div>
                            <nav class="space-y-1">
                                ${navItem('feed', 'fa-house', 'Feed')}
                                ${navItem('explore', 'fa-compass', 'Explore')}
                                ${navItem('today', 'fa-clock-rotate-left', 'Today (Stories)')}
                                ${navItem('messages', 'fa-paper-plane', 'Messages', getUnreadCount())}
                                ${navItem('notifications', 'fa-bell', 'Notifications', getUnreadNotificationsCount())}
                                ${navItem('profile', 'fa-user', 'Profile')}
                                ${state.currentUser.role === 'admin' ? navItem('admin', 'fa-shield-halved', 'Admin Panel') : ''}
                            </nav>
                        </div>
                        <div class="space-y-3">
                            <button onclick="window.openNewPostModal()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-plus"></i>
                                <span class="hidden lg:inline">Create Post</span>
                            </button>
                            <div class="flex items-center justify-between p-2 rounded-xl bg-slate-100 dark:bg-slate-800">
                                <div class="flex items-center gap-3 overflow-hidden cursor-pointer" ondblclick="window.openProfilePreview('${state.currentUser.username}')" onclick="window.viewUserProfile('${state.currentUser.username}')">
                                    <img src="${state.currentUser.avatar}" class="w-9 h-9 rounded-xl object-cover shrink-0">
                                    <div class="hidden lg:block truncate">
                                        <h4 class="font-bold text-xs truncate">${escapeHtml(state.currentUser.displayName)}</h4>
                                        <p class="text-[10px] text-slate-500">@${escapeHtml(state.currentUser.username)}</p>
                                    </div>
                                </div>
                                <button onclick="window.toggleTheme()" class="p-2 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"><i class="fa-solid ${state.theme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i></button>
                            </div>
                            <button onclick="window.logout()" class="w-full py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="hidden lg:inline">Logout</span>
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
                        ${renderMainContent()}
                    </main>
                </div>
                ${renderModals()}
            `;
        }

        function navItem(tab, icon, label, badge = 0) {
            const active = state.activeTab === tab;
            return `
                <button onclick="window.switchTab('${tab}')" class="w-full flex items-center gap-4 px-3 py-3 rounded-2xl font-semibold text-sm transition-all relative ${active ? 'bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                    <i class="fa-solid ${icon} text-lg w-6 text-center"></i>
                    <span class="hidden lg:inline">${label}</span>
                    ${badge > 0 ? `<span class="absolute right-3 lg:static lg:ml-auto px-2 py-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full">${badge}</span>` : ''}
                </button>
            `;
        }

        function getUnreadCount() {
            return state.messages.filter(m => m.recipient === state.currentUser.username && !m.read).length;
        }

        function getUnreadNotificationsCount() {
            return state.notifications.filter(n => n.recipient === state.currentUser.username && !n.read).length;
        }

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-slate-50 to-brand-50 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 w-full h-full">
                    <div class="max-w-md w-full bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-14 h-14 bg-brand-600 text-white rounded-3xl mx-auto flex items-center justify-center text-2xl font-black shadow-lg shadow-brand-500/30">G</div>
                            <h1 class="text-2xl font-extrabold tracking-tight">Welcome to GET</h1>
                            <p class="text-xs text-slate-500">Secure Account Portal — Sign in or create an account</p>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-500">Username</label>
                                <input type="text" id="auth-username" placeholder="e.g. alex_dev" class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-500">Password</label>
                                <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <div id="auth-new-user-fields" class="space-y-4 hidden transition-all">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-brand-600 dark:text-brand-400">New Account Setup: Display Name</label>
                                    <input type="text" id="auth-displayname" placeholder="e.g. Alex Turner" class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-brand-200 dark:border-brand-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                </div>
                            </div>
                            <button onclick="window.handleLogin()" id="auth-action-btn" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/30 transition-all">Sign In / Register</button>
                        </div>
                        <div class="border-t border-slate-100 dark:border-slate-800 pt-4 text-center">
                            <p class="text-xs text-slate-400">Quick Demo Accounts (Password: password123):</p>
                            <div class="flex justify-center gap-2 mt-2">
                                <button onclick="window.quickLogin('alex_dev')" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-semibold hover:bg-brand-50 hover:text-brand-600">@alex_dev</button>
                                <button onclick="window.quickLogin('sarah_c')" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-semibold hover:bg-brand-50 hover:text-brand-600">@sarah_c</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMainContent() {
            switch (state.activeTab) {
                case 'feed': return renderFeedTab();
                case 'explore': return renderExploreTab();
                case 'today': return renderTodayTab();
                case 'messages': return renderMessagesTab();
                case 'notifications': return renderNotificationsTab();
                case 'profile': return renderProfileTab();
                case 'admin': return renderAdminTab();
                default: return renderFeedTab();
            }
        }

        function renderFeedTab() {
            const feedPosts = state.posts.filter(p => !state.blocks.includes(p.author));
            return `
                <div class="flex-1 overflow-y-auto p-4 lg:p-8 max-w-2xl mx-auto w-full space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-black tracking-tight">Your Feed</h2>
                        <button onclick="window.openNewPostModal()" class="px-4 py-2 bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 font-bold text-xs rounded-xl"><i class="fa-solid fa-plus mr-1"></i> New Post</button>
                    </div>
                    <div class="space-y-4">
                        ${feedPosts.length === 0 ? `<p class="text-center text-xs text-slate-400 py-12">No posts yet. Be the first to share something!</p>` : ''}
                        ${feedPosts.map(p => {
                            const authorUser = state.allUsers.find(u => u.username === p.author) || { displayName: p.author, avatar: 'https://placehold.co/150' };
                            const isLiked = p.likes.includes(state.currentUser.username);
                            return `
                                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-sm space-y-4">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center gap-3 cursor-pointer" ondblclick="window.openProfilePreview('${p.author}')" onclick="window.viewUserProfile('${p.author}')">
                                            <img src="${authorUser.avatar}" class="w-10 h-10 rounded-2xl object-cover">
                                            <div>
                                                <h4 class="font-bold text-sm hover:underline">${escapeHtml(authorUser.displayName)}</h4>
                                                <p class="text-[10px] text-slate-400">@${escapeHtml(p.author)} • ${new Date(p.createdAt).toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                        <button onclick="window.openReportModal('post', '${p.id}')" class="text-slate-400 hover:text-red-500 text-xs"><i class="fa-solid fa-flag"></i></button>
                                    </div>
                                    <p class="text-sm leading-relaxed">${escapeHtml(p.content)}</p>
                                    ${p.image ? `
                                        <div class="rounded-2xl overflow-hidden cursor-pointer group relative bg-slate-100 dark:bg-slate-800 max-h-72 flex items-center justify-center" ondblclick="window.openMediaPreview('${p.image}', 'image')">
                                            <img src="${p.image}" class="w-full object-cover group-hover:scale-[1.01] transition-transform">
                                            <span class="absolute bottom-3 right-3 bg-black/60 text-white text-[10px] px-2.5 py-1 rounded-xl backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity">Double-click for large view</span>
                                        </div>
                                    ` : ''}
                                    <div class="flex items-center gap-6 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                                        <button onclick="window.toggleLike('${p.id}')" class="flex items-center gap-2 font-bold ${isLiked ? 'text-red-500' : 'text-slate-500 hover:text-red-500'}">
                                            <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart text-base"></i> ${p.likes.length}
                                        </button>
                                        <div class="flex items-center gap-2 text-slate-500 font-bold">
                                            <i class="fa-regular fa-comment text-base"></i> ${p.comments.length}
                                        </div>
                                    </div>
                                    <div class="space-y-3 pt-2">
                                        ${p.comments.map(c => `
                                            <div class="flex items-start gap-2 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl text-xs">
                                                <span class="font-bold cursor-pointer" onclick="window.viewUserProfile('${c.author}')">@${escapeHtml(c.author)}:</span>
                                                <span class="flex-1">${escapeHtml(c.text)}</span>
                                            </div>
                                        `).join('')}
                                        <div class="flex gap-2">
                                            <input type="text" id="comment-input-${p.id}" placeholder="Write a comment..." class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl text-xs border border-slate-200 dark:border-slate-700 focus:outline-none">
                                            <button onclick="window.addComment('${p.id}')" class="px-4 py-2.5 bg-brand-600 text-white font-bold rounded-xl text-xs">Reply</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderExploreTab() {
            return `
                <div class="flex-1 overflow-y-auto p-4 lg:p-8 max-w-4xl mx-auto w-full space-y-6">
                    <h2 class="text-xl font-black tracking-tight">Explore & Discover</h2>
                    <div>
                        <input type="text" id="explore-search" oninput="window.handleSearchInput(event)" value="${state.searchQuery}" placeholder="Search users, posts..." class="w-full px-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm focus:outline-none shadow-sm">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${state.allUsers.filter(u => u.username !== state.currentUser.username && (u.username.includes(state.searchQuery) || u.displayName.toLowerCase().includes(state.searchQuery.toLowerCase()))).map(u => {
                            const isFollowing = state.currentUser.following.includes(u.username);
                            return `
                                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                                    <div class="flex items-center gap-3 cursor-pointer" ondblclick="window.openProfilePreview('${u.username}')" onclick="window.viewUserProfile('${u.username}')">
                                        <img src="${u.avatar}" class="w-12 h-12 rounded-2xl object-cover">
                                        <div>
                                            <h4 class="font-bold text-sm hover:underline">${escapeHtml(u.displayName)}</h4>
                                            <p class="text-xs text-slate-400">@${escapeHtml(u.username)}</p>
                                        </div>
                                    </div>
                                    <button onclick="window.toggleFollow('${u.username}')" class="px-4 py-2 rounded-xl text-xs font-bold ${isFollowing ? 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300' : 'bg-brand-600 text-white'}">
                                        ${isFollowing ? 'Following' : 'Follow'}
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderTodayTab() {
            const activeStories = state.stories.filter(s => Date.now() - s.createdAt < 86400000);
            return `
                <div class="flex-1 overflow-y-auto p-4 lg:p-8 max-w-2xl mx-auto w-full space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-black tracking-tight">Today's Stories</h2>
                            <p class="text-xs text-slate-400">Disappears after 24 hours</p>
                        </div>
                        <button onclick="window.openNewStoryModal()" class="px-4 py-2 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-brand-500/20"><i class="fa-solid fa-plus mr-1"></i> Add Story</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        ${activeStories.map((s, idx) => {
                            const user = state.allUsers.find(u => u.username === s.author) || { displayName: s.author, avatar: 'https://placehold.co/150' };
                            return `
                                <div onclick="window.openStoryViewer(${idx})" class="h-64 rounded-3xl overflow-hidden relative cursor-pointer group shadow-md border border-slate-200 dark:border-slate-800">
                                    ${s.type === 'video' ? `<video src="${s.media}" class="w-full h-full object-cover"></video>` : `<img src="${s.media}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">`}
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20 p-4 flex flex-col justify-between text-white">
                                        <div class="flex items-center gap-2">
                                            <img src="${user.avatar}" class="w-7 h-7 rounded-xl object-cover border border-white/40">
                                            <span class="text-xs font-bold truncate">@${escapeHtml(s.author)}</span>
                                        </div>
                                        <p class="text-xs truncate">${escapeHtml(s.caption || '')}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderMessagesTab() {
            const users = state.allUsers.filter(u => u.username !== state.currentUser.username);
            const myGroups = state.groups.filter(g => g.members.includes(state.currentUser.username));
            return `
                <div class="flex-1 flex h-full overflow-hidden">
                    <div class="w-80 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col h-full shrink-0">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <h3 class="font-extrabold text-sm">Messages & Groups</h3>
                            <button onclick="window.openNewGroupModal()" class="p-2 bg-brand-50 dark:bg-brand-950/40 text-brand-600 rounded-xl text-xs font-bold" title="Create Group"><i class="fa-solid fa-users"></i></button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-3 space-y-2">
                            <div class="text-[10px] font-bold text-slate-400 uppercase px-2">Groups</div>
                            ${myGroups.map(g => `
                                <div onclick="window.selectGroupChat('${g.id}')" class="p-3 rounded-2xl flex items-center gap-3 cursor-pointer transition-colors ${state.activeGroupChatId === g.id ? 'bg-brand-50 dark:bg-brand-950/40 text-brand-600' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <img src="${g.avatar}" class="w-10 h-10 rounded-2xl object-cover shrink-0">
                                    <div class="flex-1 truncate">
                                        <h4 class="font-bold text-sm truncate">${escapeHtml(g.name)}</h4>
                                        <p class="text-xs text-slate-400">${g.members.length} members</p>
                                    </div>
                                </div>
                            `).join('')}
                            <div class="text-[10px] font-bold text-slate-400 uppercase px-2 pt-4">Direct Messages</div>
                            ${users.map(u => `
                                <div onclick="window.selectDirectChat('${u.username}')" class="p-3 rounded-2xl flex items-center gap-3 cursor-pointer transition-colors ${state.activeChatUser === u.username ? 'bg-brand-50 dark:bg-brand-950/40 text-brand-600' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <img src="${u.avatar}" class="w-10 h-10 rounded-2xl object-cover shrink-0">
                                    <div class="flex-1 truncate">
                                        <h4 class="font-bold text-sm truncate">${escapeHtml(u.displayName)}</h4>
                                        <p class="text-xs text-slate-400">@${escapeHtml(u.username)}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-950">
                        ${state.activeChatUser ? renderDirectChatPane() : (state.activeGroupChatId ? renderGroupChatPane() : `<div class="flex-1 flex items-center justify-center text-slate-400 text-xs">Select a conversation or group to start chatting</div>`)}

                const otherUsers = state.allUsers.filter(u => !group.members.includes(u.username));
                return `
                    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl max-w-md w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                            <div class="flex items-center justify-between">
                                <h3 class="font-black text-base">Manage Group: ${escapeHtml(group.name)}</h3>
                                <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            ${isAdmin ? `
                                <div>
                                    <label class="block text-xs font-bold mb-1">Update Group Avatar (Device Upload)</label>
                                    <input type="file" id="group-avatar-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100">
                                    <button onclick="window.saveGroupAvatar('${group.id}')" class="mt-2 w-full py-2 bg-brand-600 text-white font-bold rounded-xl text-xs">Update Avatar</button>
                                </div>
                            ` : `<p class="text-xs text-amber-500 font-bold">Only group admins can change group settings.</p>`}
                            <div class="border-t border-slate-100 dark:border-slate-800 pt-3 space-y-2">
                                <label class="block text-xs font-bold">Group Members & Admins</label>
                                <input type="text" value="${state.groupSettingsUserSearch}" oninput="window.handleGroupSettingsSearch(event)" placeholder="Search members..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl text-xs border border-slate-200 dark:border-slate-700 mb-2 focus:outline-none">
                                <div class="space-y-1 max-h-40 overflow-y-auto bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl text-xs">
                                    ${memberUsers.map(u => {
                                        const m = u.username;
                                        const isGrpAdmin = group.admins && group.admins.includes(m);
                                        return `
                                            <div class="flex items-center justify-between py-1">
                                                <span>@${escapeHtml(m)} (${escapeHtml(u.displayName)}) ${isGrpAdmin ? '<span class="text-[10px] bg-indigo-500 text-white px-1.5 py-0.5 rounded">Admin</span>' : ''}</span>
                                                ${isAdmin && m !== group.admin ? `
                                                    <div class="flex gap-2">
                                                        <button onclick="window.toggleGroupAdminStatus('${group.id}', '${m}')" class="text-[10px] text-indigo-600 font-bold">${isGrpAdmin ? 'Demote' : 'Make Admin'}</button>
                                                        <button onclick="window.removeGroupMember('${group.id}', '${m}')" class="text-[10px] text-red-500 font-bold">Remove</button>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                            ${isAdmin ? `
                                <div class="border-t border-slate-100 dark:border-slate-800 pt-3 space-y-2">
                                    <label class="block text-xs font-bold">Add Platform User</label>
                                    <div class="flex gap-2">
                                        <select id="group-add-member-select" class="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl text-xs border border-slate-200 dark:border-slate-700">
                                            ${otherUsers.map(u => `<option value="${u.username}">@${u.username} (${u.displayName})</option>`).join('')}
                                        </select>
                                        <button onclick="window.addGroupMember('${group.id}')" class="px-4 py-2 bg-brand-600 text-white font-bold rounded-xl text-xs">Add</button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }
            if (state.activeModal === 'storyViewer') {
                const s = state.stories[state.activeStoryIndex];
                if (!s) return '';
                const user = state.allUsers.find(u => u.username === s.author) || { displayName: s.author, avatar: 'https://placehold.co/150' };
                return `
                    <div class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
                        <button onclick="window.closeModal()" class="absolute top-6 right-6 text-white text-xl bg-white/10 hover:bg-white/20 p-3 rounded-full"><i class="fa-solid fa-xmark"></i></button>
                        <div class="max-w-md w-full h-[80vh] flex flex-col justify-between relative rounded-3xl overflow-hidden bg-slate-900 shadow-2xl">
                            ${s.type === 'video' ? `<video src="${s.media}" controls autoplay class="absolute inset-0 w-full h-full object-cover"></video>` : `<img src="${s.media}" class="absolute inset-0 w-full h-full object-cover">`}
                            ${s.audio ? `<audio src="${s.audio}" autoplay loop class="hidden"></audio>` : ''}
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40 p-6 flex flex-col justify-between text-white z-10 pointer-events-none">
                                <div class="flex items-center gap-3">
                                    <img src="${user.avatar}" class="w-10 h-10 rounded-2xl object-cover border border-white/40">
                                    <div>
                                        <h4 class="font-bold text-sm">@${escapeHtml(s.author)}</h4>
                                        <p class="text-[10px] text-slate-300">${new Date(s.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                    </div>
                                </div>
                                <p class="text-sm font-semibold">${escapeHtml(s.caption || '')}</p>
                            </div>
                        </div>
                    </div>
                `;
            }
            if (state.activeModal === 'editProfile') {
                return `
                    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl max-w-md w-full space-y-4 shadow-2xl">
                            <div class="flex items-center justify-between">
                                <h3 class="font-black text-base">Edit Profile Avatar & Details</h3>
                                <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <input type="text" id="edit-displayname" value="${state.currentUser.displayName}" placeholder="Display Name" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs focus:outline-none">
                            <div>
                                <label class="block text-xs font-bold mb-1">Avatar Image (Upload from Device)</label>
                                <input type="file" id="edit-avatar-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100">
                            </div>
                            <textarea id="edit-bio" placeholder="Bio" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs h-24 focus:outline-none">${state.currentUser.bio || ''}</textarea>
                            <button onclick="window.saveProfileEdits()" class="w-full py-3 bg-brand-600 text-white font-bold rounded-2xl text-xs">Save Changes</button>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        window.switchTab = (tab) => {
            state.activeTab = tab;
            render();
        };

        window.toggleTheme = () => {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            persist();
            render();
        };

        window.handleLogin = () => {
            const usernameInput = document.getElementById('auth-username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('auth-password').value;
            const newFields = document.getElementById('auth-new-user-fields');
            const actionBtn = document.getElementById('auth-action-btn');
            
            if (!usernameInput) return;

            let user = state.allUsers.find(u => u.username === usernameInput);
            
            if (!user) {
                if (newFields.classList.contains('hidden')) {
                    newFields.classList.remove('hidden');
                    actionBtn.innerText = 'Register Account';
                    return;
                }
                const displayNameInput = document.getElementById('auth-displayname').value.trim();
                user = {
                    username: usernameInput,
                    displayName: displayNameInput || usernameInput,
                    password: passwordInput || 'password123',
                    bio: 'New GET platform user.',
                    avatar: `https://placehold.co/150/6366f1/ffffff?text=${usernameInput.charAt(0).toUpperCase()}`,
                    followers: [],
                    following: [],
                    role: usernameInput === 'admin' ? 'admin' : 'user'
                };
                state.allUsers.push(user);
            } else {
                if (user.password && user.password !== passwordInput && passwordInput !== 'password123') {
                    alert('Incorrect password for this account.');
                    return;
                }
            }

            state.currentUser = user;
            persist();
            render();
        };

        window.quickLogin = (username) => {
            const user = state.allUsers.find(u => u.username === username);
            if (user) {
                state.currentUser = user;
                render();
            }
        };

        window.logout = () => {
            state.currentUser = null;
            render();
        };

        window.toggleLike = (postId) => {
            const p = state.posts.find(x => x.id === postId);
            if (!p) return;
            const idx = p.likes.indexOf(state.currentUser.username);
            if (idx >= 0) p.likes.splice(idx, 1);
            else p.likes.push(state.currentUser.username);
            persist();
            render();
        };

        window.addComment = (postId) => {
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input || !input.value.trim()) return;
            const p = state.posts.find(x => x.id === postId);
            if (!p) return;
            p.comments.push({ id: 'c_' + Date.now(), author: state.currentUser.username, text: input.value.trim(), createdAt: Date.now() });
            persist();
            render();
        };

        window.toggleFollow = (username) => {
            const target = state.allUsers.find(u => u.username === username);
            if (!target) return;
            const isFollowing = state.currentUser.following.includes(username);
            if (isFollowing) {
                state.currentUser.following = state.currentUser.following.filter(u => u !== username);
                target.followers = target.followers.filter(u => u !== state.currentUser.username);
            } else {
                state.currentUser.following.push(username);
                target.followers.push(state.currentUser.username);
                state.notifications.push({ id: 'n_' + Date.now(), recipient: username, text: `@${state.currentUser.username} started following you.`, createdAt: Date.now(), read: false });
            }
            persist();
            render();
        };

        window.viewUserProfile = (username) => {
            state.previewProfileUser = username;
            state.activeModal = 'profilePreview';
            render();
        };

        window.openProfilePreview = (username) => {
            state.previewProfileUser = username;
            state.activeModal = 'profilePreview';
            render();
        };

        window.handleSearchInput = (e) => {
            state.searchQuery = e.target.value;
            render();
        };

        window.selectDirectChat = (username) => {
            state.activeChatUser = username;
            state.activeGroupChatId = null;
            render();
        };

        window.selectGroupChat = (groupId) => {
            state.activeGroupChatId = groupId;
            state.activeChatUser = null;
            render();
        };

        window.handleChatFileSelect = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (uploadEvent) => {
                state.selectedFile = { name: file.name, type: file.type, data: uploadEvent.target.result };
                render();
            };
            reader.readAsDataURL(file);
        };

        window.clearSelectedFile = () => {
            state.selectedFile = null;
            render();
        };

        window.sendDirectMessage = () => {
            const input = document.getElementById('chat-input-field');
            const text = input ? input.value.trim() : '';
            if (!text && !state.selectedFile) return;
            state.messages.push({
                id: 'm_' + Date.now(),
                sender: state.currentUser.username,
                recipient: state.activeChatUser,
                text: text,
                fileData: state.selectedFile ? state.selectedFile.data : null,
                fileName: state.selectedFile ? state.selectedFile.name : null,
                fileType: state.selectedFile ? state.selectedFile.type : null,
                createdAt: Date.now(),
                read: false
            });
            state.selectedFile = null;
            persist();
            render();
        };

        window.sendGroupMessage = () => {
            const input = document.getElementById('group-chat-input');
            const text = input ? input.value.trim() : '';
            if (!text && !state.selectedFile) return;
            state.messages.push({
                id: 'mg_' + Date.now(),
                sender: state.currentUser.username,
                groupId: state.activeGroupChatId,
                text: text,
                fileData: state.selectedFile ? state.selectedFile.data : null,
                fileName: state.selectedFile ? state.selectedFile.name : null,
                fileType: state.selectedFile ? state.selectedFile.type : null,
                createdAt: Date.now(),
                read: false
            });
            state.selectedFile = null;
            persist();
            render();
        };

        window.openNewPostModal = () => { state.activeModal = 'newPost'; render(); };
        window.openNewStoryModal = () => { state.activeModal = 'newStory'; render(); };
        window.openNewGroupModal = () => { state.newGroupSelectedMembers = []; state.newGroupSelectedAdmins = []; state.newGroupUserSearch = ''; state.activeModal = 'newGroup'; render(); };
        window.openGroupSettings = (groupId) => { state.activeGroupChatId = groupId; state.groupSettingsUserSearch = ''; state.activeModal = 'groupSettings'; render(); };
        window.openStoryViewer = (index) => { state.activeStoryIndex = index; state.activeModal = 'storyViewer'; render(); };
        window.openEditProfileModal = () => { state.activeModal = 'editProfile'; render(); };
        window.openMediaPreview = (url, type) => { state.previewMediaUrl = url; state.previewMediaType = type; state.activeModal = 'mediaPreview'; render(); };
        window.closeModal = () => { state.activeModal = null; render(); };

        window.handleNewGroupSearch = (e) => {
            state.newGroupUserSearch = e.target.value;
            render();
        };

        window.handleGroupSettingsSearch = (e) => {
            state.groupSettingsUserSearch = e.target.value;
            render();
        };

        window.toggleNewGroupMember = (username) => {
            if (state.newGroupSelectedMembers.includes(username)) {
                state.newGroupSelectedMembers = state.newGroupSelectedMembers.filter(u => u !== username);
            } else {
                state.newGroupSelectedMembers.push(username);
            }
        };

        window.toggleNewGroupAdmin = (username) => {
            if (state.newGroupSelectedAdmins.includes(username)) {
                state.newGroupSelectedAdmins = state.newGroupSelectedAdmins.filter(u => u !== username);
            } else {
                state.newGroupSelectedAdmins.push(username);
            }
        };

        window.submitNewPost = () => {
            const content = document.getElementById('new-post-content').value.trim();
            const fileInput = document.getElementById('new-post-file');
            if (!content && (!fileInput || fileInput.files.length === 0)) return;
            if (fileInput && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.posts.unshift({ id: 'p_' + Date.now(), author: state.currentUser.username, content, image: e.target.result, likes: [], comments: [], createdAt: Date.now() });
                    state.activeModal = null;
                    persist();
                    render();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                state.posts.unshift({ id: 'p_' + Date.now(), author: state.currentUser.username, content, image: '', likes: [], comments: [], createdAt: Date.now() });
                state.activeModal = null;
                persist();
                render();
            }
        };

        window.submitNewStory = () => {
            const fileInput = document.getElementById('new-story-file');
            const audioInput = document.getElementById('new-story-audio');
            const caption = document.getElementById('new-story-caption').value.trim();
            if (!fileInput || fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const mediaData = e.target.result;
                const mediaType = file.type.startsWith('video') ? 'video' : 'image';
                if (audioInput && audioInput.files[0]) {
                    const audioReader = new FileReader();
                    audioReader.onload = (ae) => {
                        state.stories.unshift({ id: 's_' + Date.now(), author: state.currentUser.username, media: mediaData, type: mediaType, audio: ae.target.result, caption, createdAt: Date.now() });
                        state.activeModal = null;
                        persist();
                        render();
                    };
                    audioReader.readAsDataURL(audioInput.files[0]);
                } else {
                    state.stories.unshift({ id: 's_' + Date.now(), author: state.currentUser.username, media: mediaData, type: mediaType, audio: null, caption, createdAt: Date.now() });
                    state.activeModal = null;
                    persist();
                    render();
                }
            };
            reader.readAsDataURL(file);
        };

        window.submitNewGroup = () => {
            const name = document.getElementById('new-group-name').value.trim();
            const avatarFile = document.getElementById('new-group-avatar-file');
            if (!name) return;
            const members = Array.from(new Set([state.currentUser.username, ...state.newGroupSelectedMembers]));
            const admins = Array.from(new Set([state.currentUser.username, ...state.newGroupSelectedAdmins]));

            if (avatarFile && avatarFile.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const newGroup = { id: 'g_' + Date.now(), name, admin: state.currentUser.username, admins, members, avatar: e.target.result };
                    state.groups.push(newGroup);
                    state.activeModal = null;
                    state.activeGroupChatId = newGroup.id;
                    persist();
                    render();
                };
                reader.readAsDataURL(avatarFile.files[0]);
            } else {
                const newGroup = { id: 'g_' + Date.now(), name, admin: state.currentUser.username, admins, members, avatar: 'https://placehold.co/150/0ea5e9/ffffff?text=Group' };
                state.groups.push(newGroup);
                state.activeModal = null;
                state.activeGroupChatId = newGroup.id;
                persist();
                render();
            }
        };

        window.saveGroupAvatar = (groupId) => {
            const avatarFile = document.getElementById('group-avatar-file');
            const group = state.groups.find(g => g.id === groupId);
            if (group && group.admins && group.admins.includes(state.currentUser.username) && avatarFile && avatarFile.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    group.avatar = e.target.result;
                    persist();
                    render();
                };
                reader.readAsDataURL(avatarFile.files[0]);
            }
        };

        window.addGroupMember = (groupId) => {
            const select = document.getElementById('group-add-member-select');
            const username = select ? select.value : '';
            const group = state.groups.find(g => g.id === groupId);
            if (group && username && !group.members.includes(username)) {
                group.members.push(username);
                persist();
                render();
            }
        };

        window.removeGroupMember = (groupId, username) => {
            const group = state.groups.find(g => g.id === groupId);
            if (group && group.admins && group.admins.includes(state.currentUser.username)) {
                group.members = group.members.filter(m => m !== username);
                group.admins = group.admins.filter(a => a !== username);
                persist();
                render();
            }
        };

        window.toggleGroupAdminStatus = (groupId, username) => {
            const group = state.groups.find(g => g.id === groupId);
            if (group && group.admins && group.admins.includes(state.currentUser.username)) {
                if (group.admins.includes(username)) {
                    if (group.admins.length > 1) {
                        group.admins = group.admins.filter(a => a !== username);
                    }
                } else {
                    group.admins.push(username);
                }
                persist();
                render();
            }
        };

        window.saveProfileEdits = () => {
            const displayName = document.getElementById('edit-displayname').value.trim();
            const avatarFile = document.getElementById('edit-avatar-file');
            const bio = document.getElementById('edit-bio').value.trim();
            if (displayName) state.currentUser.displayName = displayName;
            state.currentUser.bio = bio;

            if (avatarFile && avatarFile.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.currentUser.avatar = e.target.result;
                    const idx = state.allUsers.findIndex(u => u.username === state.currentUser.username);
                    if (idx >= 0) state.allUsers[idx] = state.currentUser;
                    state.activeModal = null;
                    persist();
                    render();
                };
                reader.readAsDataURL(avatarFile.files[0]);
            } else {
                const idx = state.allUsers.findIndex(u => u.username === state.currentUser.username);
                if (idx >= 0) state.allUsers[idx] = state.currentUser;
                state.activeModal = null;
                persist();
                render();
            }
        };

        window.startCall = (username, type) => {
            alert(`Calling @${username} (${type})... Simulation active.`);
        };

        window.openReportModal = (type, targetId) => {
            state.reports.push({ id: 'r_' + Date.now(), type, targetId, reporter: state.currentUser.username });
            persist();
            alert('Report submitted to administrators.');
        };

        window.resolveReport = (reportId) => {
            state.reports = state.reports.filter(r => r.id !== reportId);
            persist();
            render();
        };

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
